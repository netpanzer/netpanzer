name: Windows
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

on:
  # Run manually for release packages: builds optimized and stripped.
  workflow_dispatch:
  push:
    branches: master
    paths:
    - 'src/**/**'
    - 'support/**/*.cpp'
    - 'support/scripts/package-windows-portable.py'
    - '**meson.build'
    - 'setup-build.*'
    - 'subprojects/*.wrap'
    - '**/windows.yml'
  pull_request:
    branches: master
    paths:
    - 'src/**/**'
    - 'support/scripts/package-windows-portable.py'
    - '**meson.build'
    - 'setup-build.*'
    - 'subprojects/*.wrap'
    - '**/windows.yml'

jobs:
  build:
    name: ${{ matrix.build.os }}
    strategy:
      fail-fast: false
      matrix:
        build:
          - os: windows-2022

    runs-on: ${{ matrix.build.os }}
    env:
      NETPANZER_DATADIR: ${{ github.workspace }}/data
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Show info
        run: |
          echo '${{ toJSON(matrix) }}'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Python Dependencies
        run: pip install meson ninja

      - name: Install MinGW
        uses: egor-tensin/setup-mingw@v2
        with:
          version: 12.2.0

      - name: Setup
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            .\setup-build.bat _build -Dbuildtype=release -Dstrip=true
          } else {
            .\setup-build.bat _build
          }

      - name: Build
        run: |
          cd _build
          ninja -v

      - name: Test
        run: |
          cd _build
          meson test --suite=netpanzer -v

      - name: Package portable zip
        run: |
          python support/scripts/package-windows-portable.py --build-dir _build --out-dir dist

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: netpanzer_winbin
          path: ${{ github.workspace }}/_build/*.exe

      - name: Upload portable zip
        uses: actions/upload-artifact@v4
        with:
          name: netpanzer_windows_portable
          path: ${{ github.workspace }}/dist/*.zip
          if-no-files-found: error
