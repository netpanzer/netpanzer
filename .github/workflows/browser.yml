name: Browser client
on:
  push:
    branches: [master]
    tags: ['web-*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: browser-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: support/web/package-lock.json
      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build pkg-config liblua5.1-0-dev libphysfs-dev libsdl2-dev libsdl2-mixer-dev libsdl2-ttf-dev
          python -m pip install meson==1.3.2
      - uses: actions/checkout@v4
        with:
          repository: emscripten-core/emsdk
          ref: '4.0.15'
          path: .emsdk
          persist-credentials: false
      - name: Build WebAssembly with the pinned SDK
        run: |
          .emsdk/emsdk install 4.0.15
          .emsdk/emsdk activate 4.0.15
          source .emsdk/emsdk_env.sh
          bash support/web/build.sh
      - name: Build native test server
        run: |
          meson setup build-web-native -Dbuildtype=release -Db_sanitize=none -Dnls=false -Dbuild_tests=true
          meson compile -C build-web-native -j 4
          meson devenv -C build-web-native meson test --suite netpanzer --print-errorlogs
      - name: Test transport and both browsers
        run: |
          npm ci --prefix support/web
          npm test --prefix support/web
          cd support/web
          npx playwright install --with-deps chrome firefox
          cd ../..
          node support/web/server.mjs --native build-web-native/netpanzer > browser-server.log 2>&1 &
          runner=$!
          trap 'kill "$runner" || true' EXIT
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8080/servers >/dev/null; then break; fi
            sleep 1
          done
          npm run test:browser --prefix support/web
      - name: Package verified browser build
        run: python support/web/package-release.py --revision "$GITHUB_SHA"
      - uses: actions/upload-artifact@v4
        with:
          name: netpanzer-web-${{ github.sha }}
          path: dist-web/*
          compression-level: 0
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-test-results
          path: |
            support/web/test-results/
            browser-server.log
          retention-days: 14

  publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/web-')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: netpanzer-web-${{ github.sha }}
          path: dist-web
      - name: Publish immutable browser release (not the desktop latest release)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          test "$GITHUB_REF_NAME" = "web-$GITHUB_SHA"
          gh release create "$GITHUB_REF_NAME" dist-web/* \
            --target "$GITHUB_SHA" --title "Browser build ${GITHUB_SHA:0:8}" \
            --prerelease --latest=false \
            --notes "Tested Chrome/Firefox browser build. Source and build instructions: https://github.com/$GITHUB_REPOSITORY/tree/$GITHUB_SHA/support/web. The Django deployment pins this archive by SHA-256."
