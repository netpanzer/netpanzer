[binaries]
c = 'emcc'
cpp = 'em++'
ar = 'emar'
strip = 'emstrip'

[host_machine]
system = 'emscripten'
cpu_family = 'wasm32'
cpu = 'wasm32'
endian = 'little'

[properties]
needs_exe_wrapper = true

[built-in options]
buildtype = 'release'
b_sanitize = 'none'
b_lundef = true
default_library = 'static'

[project options]
nls = false
build_tests = false
